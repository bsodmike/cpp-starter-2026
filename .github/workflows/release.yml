name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  artifacts:
    name: package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-26.04
          - name: macos-arm64
            runner: macos-26
          - name: windows-x64
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Check out vcpkg at the pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout --detach "$(./scripts/tool-version.sh vcpkg)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$HOME/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build, test and package the release preset
        run: cmake --workflow --preset release

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/release
          shopt -s nullglob
          for file in acme-*.tar.gz acme-*.zip; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done
          ls -la acme-* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acme-${{ matrix.name }}
          path: |
            build/release/acme-*.tar.gz
            build/release/acme-*.zip
            build/release/acme-*.sha256
          if-no-files-found: error

  publish:
    name: draft release with SBOM
    needs: artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate SBOM from the vcpkg manifest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          artifact-name: acme-sbom.cyclonedx.json
          output-file: dist/acme-sbom.cyclonedx.json

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/acme-*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --title "acme $TAG" \
            --generate-notes \
            dist/*
